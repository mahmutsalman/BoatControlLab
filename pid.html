<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PID on the Boat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--panel:#112236;--line:#1e4060;--text:#d4e8f7;--say:#a8c2d4;--dim:#8aa3b5;
  --boat:#f2f2f2;--goal:#7fd77f;--err:#5b8cff;--err2:#4fe0b0;--p:#8f7cff;--i:#ff6ad5;--d:#4aa3ff;--rud:#c792ea;--far:#ef5f6b;--turn:#4fd1c5;--wind:#f4a261}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px "IBM Plex Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:16px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}
.dot.on{background:var(--text)}
button,a.btn{font:inherit;background:var(--line);color:var(--text);border:0;border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none}
h1{font-size:28px;margin:6px 0 4px}
canvas{width:min(1000px,100%);background:var(--panel);border-radius:14px;display:block}
.cap{font-size:22px;color:var(--say);margin:14px 0 4px;text-align:center}
.hint{color:var(--dim);font-size:13px}
.mine{display:none;width:min(1000px,100%);margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:16px;line-height:1.8}
.mine .k{color:var(--dim);display:inline-block;min-width:130px}
.calc{display:none;width:min(1000px,100%);margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.calc h3{margin:0 0 8px;font-size:18px}
.calc label{display:flex;gap:12px;align-items:center;margin:6px 0;color:var(--say)}
.calc input{flex:1}
.calc .v{min-width:70px;font-weight:600;color:var(--text)}
.calc pre{font:18px/1.7 "IBM Plex Mono",monospace;margin:8px 0}
</style>
</head>
<body>
<div class="top"><a class="btn" href="index.html">⌂</a><button id="prev">←</button><div id="dots" style="display:flex;gap:8px"></div><button id="next">→</button></div>
<h1 id="title"></h1>
<canvas id="cv" width="1000" height="520"></canvas>
<div class="cap" id="cap"></div>
<div class="mine" id="mine"></div>
<div class="hint">← → next screen · space = pause · it loops</div>
<div class="calc" id="calc">
  <h3>🧮 P calculator: drag the error and Kp</h3>
  <label><span style="color:var(--err)">error</span><input type="range" id="cErr" min="-100" max="100" step="5" value="100"><span class="v" id="cErrV"></span></label>
  <label><span style="color:var(--p)">Kp</span><input type="range" id="cKp" min="0" max="3" step="0.1" value="0.5"><span class="v" id="cKpV"></span></label>
  <pre id="cOut"></pre>
  <canvas id="cCv" width="960" height="110" style="width:100%;height:110px;background:#0a1624"></canvas>
</div>

<script>
// ---------- the boat and a PID captain (same model as the lab) ----------
const DT = 0.1, KB = 0.2, T = 3, LIMIT = 35, GOAL = 90;
function clip(x) {
  if (x > LIMIT) { return LIMIT; }
  if (x < -LIMIT) { return -LIMIT; }
  return x;
}
// one trip with a PID captain; every 0.1 s we keep every number so the screens can show it
function pidTrip(Kp, Ki, Kd, wind, seconds) {
  let heading = 0, turn = 0, sum = 0;
  const rows = [];
  for (let n = 0; n <= seconds / DT; n++) {
    const error = GOAL - heading;
    const p = Kp * error;
    const d = Kd * (-turn);                       // the error shrinks as fast as the boat turns
    const wantsIfAdded = p + Ki * (sum + error * DT) + d;
    if (Ki > 0 && Math.abs(wantsIfAdded) < LIMIT) {
      sum += error * DT;                           // the memory only grows while the rudder is not stuck at the limit
    }
    const i = Ki * sum;
    const rudder = clip(p + i + d);
    rows.push({ t: n * DT, heading, turn, error, p, i, d, rudder });
    const newTurn = turn + DT * ((KB * rudder - turn) / T + wind);
    heading = heading + DT * newTurn;
    turn = newTurn;
  }
  return rows;
}
// a trip with any start and any push from the sea (push(t) in °/s²), same PID rules as pidTrip
function seaTrip(o) {
  let heading = o.start, turn = 0, sum = 0;
  const rows = [];
  for (let n = 0; n <= o.seconds / DT; n++) {
    const t = n * DT, error = GOAL - heading;
    const p = o.Kp * error;
    const d = o.Kd * (-turn);
    const wantsIfAdded = p + o.Ki * (sum + error * DT) + d;
    if (o.Ki > 0 && Math.abs(wantsIfAdded) < LIMIT) { sum += error * DT; }
    const i = o.Ki * sum;
    const rudder = clip(p + i + d);
    rows.push({ t, heading, turn, error, sum, p, i, d, rudder });
    const newTurn = turn + DT * ((KB * rudder - turn) / T + o.push(t));
    heading = heading + DT * newTurn;
    turn = newTurn;
  }
  return rows;
}
const at = (rows, t) => rows[Math.min(rows.length - 1, Math.floor(t / DT))];
const fmt = x => (Math.round(x * 10) / 10).toFixed(1);
const maxOf = (rows, key) => Math.max(...rows.map(r => r[key]));

// ---------- drawing helpers ----------
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ang = d => (d - 90) * Math.PI / 180;
function text(s, x, y, size, col, align = "center", bold = true) {
  g.font = (bold ? "600 " : "") + size + "px IBM Plex Mono"; g.fillStyle = col; g.textAlign = align; g.fillText(s, x, y);
}
// a ship seen from above, bow pointing up (−y), centred on the origin of the current transform
function shipShape(L, B, col) {
  // the white wake behind the stern: two lines opening into a V
  g.strokeStyle = "rgba(242,242,242,.22)"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-B * 0.6, L / 2); g.lineTo(-B * 1.6, L * 1.05); g.moveTo(B * 0.6, L / 2); g.lineTo(B * 1.6, L * 1.05); g.stroke();
  // the hull: a pointed bow, straight sides, a flat stern
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(0, -L / 2);
  g.quadraticCurveTo(B * 1.05, -L * 0.28, B, -L * 0.05);
  g.lineTo(B * 0.9, L / 2);
  g.lineTo(-B * 0.9, L / 2);
  g.lineTo(-B, -L * 0.05);
  g.quadraticCurveTo(-B * 1.05, -L * 0.28, 0, -L / 2);
  g.fill();
  g.strokeStyle = "rgba(13,27,42,.55)"; g.lineWidth = 1.5; g.stroke();
  // the deck line and the bridge (cabin) near the stern
  g.strokeStyle = "rgba(13,27,42,.35)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, -L * 0.38); g.lineTo(0, L * 0.05); g.stroke();
  g.fillStyle = "#5a7d9a"; g.fillRect(-B * 0.55, L * 0.12, B * 1.1, L * 0.22);
  g.fillStyle = "#9fd0f0"; g.fillRect(-B * 0.45, L * 0.13, B * 0.9, L * 0.04);   // the bridge windows look forward
  // the bow: a small dark mark so the front is obvious
  g.fillStyle = "rgba(13,27,42,.7)"; g.beginPath(); g.arc(0, -L * 0.36, Math.max(2.5, B * 0.12), 0, 7); g.fill();
}
function boat(cx, cy, R, heading, rudder, col) {
  g.strokeStyle = C("--line"); g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  g.setLineDash([7, 5]); g.strokeStyle = C("--goal"); g.lineWidth = 3;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ang(GOAL)) * R, cy + Math.sin(ang(GOAL)) * R); g.stroke(); g.setLineDash([]);
  g.save(); g.translate(cx, cy); g.rotate(heading * Math.PI / 180);
  const L = R * 0.85, B = R * 0.24;
  shipShape(L, B, col || C("--boat"));
  g.translate(0, L / 2); g.rotate(-rudder * Math.PI / 180);
  g.strokeStyle = C("--rud"); g.lineWidth = 6; g.lineCap = "round"; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, L * 0.3); g.stroke();
  g.restore();
}
// a time graph like the video's: axes, an optional dashed setpoint, one or more lines drawn up to "now"
function graph(x, y, w, h, opt) {
  const X = t => x + t / opt.tMax * w, Y = v => y + h - (v - opt.vMin) / (opt.vMax - opt.vMin) * h;
  g.strokeStyle = C("--dim"); g.lineWidth = 2;
  g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x, y + h); g.lineTo(x + w + 8, y + h); g.stroke();
  text(opt.label, x - 12, y - 14, 15, C("--dim"), "left");
  if (!opt.xStep) { text("time", x + w, y + h + 20, 13, C("--dim"), "right", false); }
  for (const v of (opt.ticks || [])) {                   // numbers on the y axis + a light grid
    g.strokeStyle = "rgba(138,163,181,.15)"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, Y(v)); g.lineTo(x + w, Y(v)); g.stroke();
    text(String(v), x - 6, Y(v) + 4, 12, C("--dim"), "right", false);
  }
  if (opt.xStep) {                                         // numbers on the time axis
    for (let tt = 0; tt <= opt.tMax; tt += opt.xStep) { text(tt + "s", X(tt), y + h + 16, 12, C("--dim"), "center", false); }
  }
  for (const hl of (opt.lines || [])) {
    g.setLineDash([6, 5]); g.strokeStyle = hl.col; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, Y(hl.v)); g.lineTo(x + w, Y(hl.v)); g.stroke(); g.setLineDash([]);
    text(hl.label, x - 8, Y(hl.v) + 5, 13, hl.col, "right");
  }
  for (const s of opt.series) {
    g.strokeStyle = s.col; g.lineWidth = 3; g.beginPath();
    let first = true, last = null;
    for (const r of s.rows) {
      if (r.t > opt.now) { break; }
      const v = s.value(r);
      if (first) { g.moveTo(X(r.t), Y(v)); first = false; } else { g.lineTo(X(r.t), Y(v)); }
      last = { x: X(r.t), y: Y(v) };
    }
    g.stroke();
    if (s.name && last) { text(s.name, last.x + 8, last.y + (s.nameDy || 0) + 5, 13, s.col, "left"); }   // the line's name at its tip
  }
  return { X, Y };
}
// one bar per part (P, I, D) and their sum: the rudder
function bars(x, y, parts) {
  const scale = 5, mid = x + 150;
  g.strokeStyle = C("--line"); g.lineWidth = 1; g.beginPath(); g.moveTo(mid, y - 18); g.lineTo(mid, y + parts.length * 34); g.stroke();
  parts.forEach((p, k) => {
    const yy = y + k * 34, len = Math.max(-140, Math.min(140, p.v * scale / 1.4));
    g.fillStyle = p.col; g.fillRect(Math.min(mid, mid + len), yy, Math.abs(len), 22);
    text(p.name, x, yy + 17, 16, p.col, "left");
    text(fmt(p.v) + "°", x + 310, yy + 17, 16, p.col, "left");
  });
}
function pinkArrow(x, y1, y2, label) {
  g.strokeStyle = C("--i"); g.fillStyle = C("--i"); g.lineWidth = 4;
  g.beginPath(); g.moveTo(x, y1); g.lineTo(x, y2); g.stroke();
  const dir = y2 > y1 ? 1 : -1;
  g.beginPath(); g.moveTo(x - 8, y2 - dir * 12); g.lineTo(x + 8, y2 - dir * 12); g.lineTo(x, y2); g.fill();
  text(label, x + 14, (y1 + y2) / 2 + 6, 18, C("--i"), "left");
}

// ---------- the trips every screen uses (all from the model above) ----------
const LOOP = pidTrip(3.5, 0.1, 6, 0, 30);
const P_ALONE = pidTrip(3, 0, 0, 0, 30);
const P_WIND_1 = pidTrip(1, 0, 0, -0.6, 50);
const P_WIND_3 = pidTrip(3, 0, 0, -0.6, 50);
const PI_WIND = pidTrip(1, 0.05, 0, -0.6, 50);
const P_CALM_1 = pidTrip(1, 0, 0, 0, 50);       // no wind, P alone (Kp 1)
const PI_CALM = pidTrip(1, 0.05, 0, 0, 50);      // no wind, P + I (the same Kp 1, Ki 0.05 as the wind screen)
const PD = pidTrip(3, 0, 6, 0, 30);
const TUNED = pidTrip(3.5, 0.1, 6, -0.6, 40);
const SIDE_0 = pidTrip(3, 0, 0, 0, 36);
const SIDE_6 = pidTrip(3, 0, 6, 0, 36);
const SIDE_10 = pidTrip(3, 0, 10, 0, 36);
const ONLY_P = pidTrip(3, 0, 0, 0, 40);
const I_CALM_P = seaTrip({ start: 60, Kp: 1, Ki: 0, Kd: 0, seconds: 40, push: () => 0 });     // no wind, P alone
const I_CALM_PI = seaTrip({ start: 60, Kp: 1, Ki: 0.1, Kd: 0, seconds: 40, push: () => 0 });  // no wind, P + I
const I_WIND = seaTrip({ start: 90, Kp: 1, Ki: 0.1, Kd: 0, seconds: 40, push: () => -0.6 });   // on the line, then a steady wind
function gust(t) { if (t >= 2 && t < 3.5) { return -3; } return 0; }                       // a 1.5 s gust pushing the bow left
const GUST_NONE = seaTrip({ start: 90, Kp: 0, Ki: 0, Kd: 0, seconds: 20, push: gust });
const GUST_D = seaTrip({ start: 90, Kp: 0, Ki: 0, Kd: 6, seconds: 20, push: gust });
const ONLY_I = pidTrip(0, 0.1, 0, 0, 40);
const ONLY_D = pidTrip(0, 0, 6, 0, 40);
// the "what the order means" boats: start somewhere, hold ONE rudder order, watch which way the nose goes
function holdRudder(startHeading, rudder, seconds) {
  let heading = startHeading, turn = 0;
  const rows = [];
  for (let n = 0; n <= seconds / DT; n++) {
    rows.push({ t: n * DT, heading, rudder });
    turn = turn + DT * ((KB * rudder - turn) / T);
    heading = heading + DT * turn;
  }
  return rows;
}
const ORDER_RIGHT = holdRudder(60, 35, 6);
const ORDER_LEFT = holdRudder(120, -35, 6);
const ORDER_HOLD = holdRudder(90.8, 0, 6);
// scripted inputs for the "what does this block do with an error" screens (like the video's step graphs)
function scripted(seconds, errorAt) {
  const rows = [];
  for (let n = 0; n <= seconds / DT; n++) { rows.push({ t: n * DT, e: errorAt(n * DT) }); }
  return rows;
}
// 20° → 60° → 20°, each change taking 1 s (a ship can't jump)
const STEP = scripted(12, t => {
  if (t < 3) { return 20; }
  if (t < 4) { return 20 + 40 * (t - 3); }
  if (t < 9) { return 60; }
  if (t < 10) { return 60 - 40 * (t - 9); }
  return 20;
});
const SMALL = scripted(12, t => { if (t < 6) { return 20; } return 0; });
const BIG = scripted(12, t => { if (t < 8) { return 40; } return 0; });
function areaUpTo(rows, t) { let a = 0; for (const r of rows) { if (r.t >= t) { break; } a += r.e * DT; } return a; }
function ramp(slope) { return scripted(10, t => { if (t < 2) { return 10; } if (t < 7) { return 10 + slope * (t - 2); } return 10 + slope * 5; }); }
const RAMP5 = ramp(5), RAMP8 = ramp(8);
function slopeAt(t, slope) { if (t >= 2 && t < 7) { return slope; } return 0; }

// ---------- the screens: one per image of the video ----------
const SCREENS = [
  { title: "the loop", cap: "error = setpoint − heading, every 0.1 s, forever", dur: 30, speed: 2, draw(t) {
      const r = at(LOOP, t);
      const box = (x, y, w, h, top, ours, val, col) => {
        g.strokeStyle = col || C("--say"); g.lineWidth = 2; g.strokeRect(x, y, w, h);
        text(top, x + w / 2, y + 24, 15, C("--dim"), "center", false);
        text(ours, x + w / 2, y + 48, 17, col || C("--text"));
        if (val) { text(val, x + w / 2, y + 74, 18, C("--text")); }
      };
      const arrow = (x1, y1, x2, y2, label) => {
        g.strokeStyle = C("--dim"); g.fillStyle = C("--dim"); g.lineWidth = 2;
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
        const a = Math.atan2(y2 - y1, x2 - x1);
        g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - 12 * Math.cos(a - 0.4), y2 - 12 * Math.sin(a - 0.4)); g.lineTo(x2 - 12 * Math.cos(a + 0.4), y2 - 12 * Math.sin(a + 0.4)); g.fill();
        const f = (t * 0.8) % 1;                                    // a dot that travels along the arrow
        g.fillStyle = C("--goal"); g.beginPath(); g.arc(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f, 4, 0, 7); g.fill();
        if (label) { text(label, (x1 + x2) / 2, (y1 + y2) / 2 - 10, 14, C("--say"), "center", false); }
      };
      text("setpoint", 50, 70, 15, C("--dim"), "left", false); text("90°", 50, 98, 22, C("--goal"), "left");
      arrow(110, 120, 150, 120);
      g.strokeStyle = C("--text"); g.lineWidth = 2; g.beginPath(); g.arc(168, 120, 18, 0, 7); g.stroke(); text("±", 168, 127, 18, C("--text"));
      arrow(186, 120, 240, 120);
      text("error", 213, 160, 14, C("--err"), "center", false); text(fmt(r.error) + "°", 213, 182, 17, C("--err"));
      // the PID box: its three parts, and their sum = the output (the rudder angle it orders)
      const order = r.p + r.i + r.d;
      g.strokeStyle = C("--p"); g.lineWidth = 2; g.strokeRect(240, 70, 210, 100);
      text("PID", 345, 66, 13, C("--dim"), "center", false);
      text("P " + fmt(r.p), 256, 98, 15, C("--p"), "left");
      text("I " + fmt(r.i), 256, 124, 15, C("--i"), "left");
      text("D " + fmt(r.d), 256, 150, 15, C("--d"), "left");
      text("sum", 400, 108, 13, C("--dim"), "center", false);
      text(fmt(order), 400, 134, 20, C("--text"));
      arrow(450, 120, 520, 120, "output");
      if (Math.abs(order) > LIMIT) {
        text(fmt(order) + "°", 485, 145, 15, C("--far"));
        text("> limit", 485, 163, 12, C("--far"), "center", false);
      } else {
        text(fmt(order) + "°", 485, 145, 15, C("--text"));
      }
      box(520, 70, 200, 100, "final control element", "rudder", fmt(r.rudder) + "°", C("--rud"));
      arrow(720, 120, 780, 120);
      box(780, 70, 180, 100, "process", "the boat", "", C("--boat"));
      g.strokeStyle = C("--dim"); g.lineWidth = 2; g.beginPath(); g.moveTo(870, 170); g.lineTo(870, 300); g.stroke();
      arrow(870, 300, 650, 300);
      box(470, 250, 180, 100, "transmitter", "compass", fmt(r.heading) + "°", C("--turn"));
      g.beginPath(); g.moveTo(470, 300); g.lineTo(168, 300); g.stroke();
      arrow(168, 300, 168, 140);
      text("process variable = heading", 185, 230, 14, C("--turn"), "left", false);
      boat(160, 430, 70, r.heading, r.rudder);
      text("error = 90 − " + fmt(r.heading) + " = " + fmt(r.error) + "°", 600, 440, 22, C("--err"));
  } },
  { title: "the parts, one by one", cap: "each box has ONE job", dur: 21, draw(t) {
      // the same loop, frozen at one moment (heading 90.8°), one part lit every 3 s
      const PARTS = [
        { box: [40, 60, 100, 70], role: "the GOAL", job: "the course we want", ex: "90° = point east", col: C("--goal") },
        { box: [146, 98, 44, 44], role: "the COMPARE", job: "goal − where we are", ex: "90 − 90.8 = −0.8°", col: C("--err") },
        { box: [240, 70, 210, 100], role: "the BRAIN", job: "gets only the error, decides", ex: "P −2.8 + I 2.6 + D 0.2 = 0.0", col: C("--p") },
        { box: [452, 92, 66, 40], role: "the ORDER", job: "just a number: rudder to …°", ex: "0.0° → go straight", col: C("--text") },
        { box: [520, 70, 200, 100], role: "the MUSCLE", job: "moves the rudder (max ±35°)", ex: "blade at 0.0°", col: C("--rud") },
        { box: [780, 70, 180, 100], role: "the THING we control", job: "turns slowly, the sea pushes it", ex: "its heading changes", col: C("--boat") },
        { box: [470, 250, 180, 100], role: "the EYES", job: "measures the heading, sends it back", ex: "90.8°", col: C("--turn") },
      ];
      const k = Math.min(PARTS.length - 1, Math.floor(t / 3));
      const box = (x, y, w, h, top, ours, val, col) => {
        g.strokeStyle = col; g.lineWidth = 2; g.strokeRect(x, y, w, h);
        text(top, x + w / 2, y + 24, 15, C("--dim"), "center", false);
        text(ours, x + w / 2, y + 48, 17, col);
        if (val) { text(val, x + w / 2, y + 74, 18, C("--text")); }
      };
      const line = (pts) => { g.strokeStyle = C("--dim"); g.lineWidth = 2; g.beginPath(); pts.forEach(([x, y], n) => { if (n) { g.lineTo(x, y); } else { g.moveTo(x, y); } }); g.stroke(); };
      // the whole loop, dimmed
      g.globalAlpha = 0.3;
      text("setpoint", 50, 85, 15, C("--dim"), "left", false); text("90°", 50, 113, 22, C("--goal"), "left");
      line([[110, 120], [150, 120]]);
      g.strokeStyle = C("--text"); g.lineWidth = 2; g.beginPath(); g.arc(168, 120, 18, 0, 7); g.stroke(); text("±", 168, 127, 18, C("--text"));
      line([[186, 120], [240, 120]]);
      box(240, 70, 210, 100, "PID", "", "", C("--p"));
      text("P −2.8   I 2.6   D 0.2", 345, 130, 14, C("--text"));
      line([[450, 120], [520, 120]]); text("output", 485, 110, 13, C("--say"), "center", false);
      box(520, 70, 200, 100, "final control element", "rudder", "0.0°", C("--rud"));
      line([[720, 120], [780, 120]]);
      box(780, 70, 180, 100, "process", "the boat", "", C("--boat"));
      line([[870, 170], [870, 300], [650, 300]]);
      box(470, 250, 180, 100, "transmitter", "compass", "90.8°", C("--turn"));
      line([[470, 300], [168, 300], [168, 140]]);
      g.globalAlpha = 1;

const CLAMP = "clamp(…, −35, +35) = Mathf.Clamp: the rudder can't go further";
const FORMULAS = {
  "the loop": ["error = setpoint − process variable", "error = goal − where the nose is · rudder = clamp(P + I + D, −35, +35)"],
  "the parts, one by one": ["setpoint → ± → PID → output → final control element → process → transmitter", "goal → compare → brain → order → rudder → ship → compass → back"],
  "what the order means": ["output = P + I + D", "sign = which way · size = how hard · rudder = clamp(order, −35, +35)"],
  "P = Kp × error": ["P = Kp · e(t)", "P = X × error · X = rudder ° per 1° wrong (here X = 0.5) · rudder = clamp(P, −35, +35)"],
  "P alone on the boat": ["P = Kp · e(t), Kp = 3", "rudder = clamp(3 × error, −35, +35) · above 35 / 3 = 11.7° wrong → always full 35°"],
  "offset: P alone + wind": ["P = Kp · e(t) → steady-state error (offset)", "the wind needs 9° rudder · 9 = X × error → error must stay 9 / X"],
  "I without wind": ["I = Ki · ∫ e(t) dt", "every 0.1 s: sum = sum + error × 0.1 · I = Y × sum (Y = 0.1)"],
  "I = Ki × (error × time)": ["I = Ki · ∫ e(t) dt", "every 0.1 s: sum = sum + error × 0.1 · I = Y × sum · rudder = clamp(X·error + I, −35, +35)"],
  "P + I on the boat, NO wind": ["u = Kp · e + Ki · ∫ e dt", "rudder = clamp(X × error + Y × sum, −35, +35) · X = 1, Y = 0.05 · no wind: P alone ends at 90°, so I is only extra push"],
  "P + I on the boat, in the wind": ["u = Kp · e + Ki · ∫ e dt", "rudder = clamp(X × error + Y × sum, −35, +35) · X = 1, Y = 0.05"],
  "D = Kd × slope": ["D = Kd · de(t)/dt", "D = Z × how fast the error changes = Z × (−turn) · Z = 6"],
  "D on the boat = the brake": ["u = Kp · e + Kd · de/dt", "rudder = clamp(X × error + Z × (−turn), −35, +35) · X = 3, Z = 6"],
  "arrive from ONE side (like a limit)": ["more Kd → overdamped: no overshoot", "bigger Z = a stronger brake → never past 90°, but later"],
  "each one ALONE": ["P = Kp·e · I = Ki·∫e dt · D = Kd·de/dt", "only X: works · only Y: swings · only Z: never moves (no turn → no brake)"],
  "tuning: all three": ["u = Kp·e + Ki·∫e dt + Kd·de/dt", "rudder = clamp(X·error + Y·sum + Z·(−turn), −35, +35) · X 3.5, Y 0.1, Z 6"],
};
function showFormulas() {
  const f = FORMULAS[SCREENS[idx].title], box = document.getElementById("mine");
  if (!f) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = `<span class="k">📘 textbook</span>${f[0]}<br><span class="k">📝 my way</span><b>${f[1]}</b>`;
}
// ---------- player ----------
let idx = 0, t0 = performance.now(), paused = false, pausedAt = 0;
const dots = document.getElementById("dots");
dots.innerHTML = SCREENS.map((_, i) => `<div class="dot" data-i="${i}"></div>`).join("");
dots.onclick = e => { if (e.target.dataset.i) { show(+e.target.dataset.i); } if (document.activeElement) { document.activeElement.blur(); } };
function show(i) {
  idx = (i + SCREENS.length) % SCREENS.length; t0 = performance.now(); pausedAt = t0;
  document.getElementById("title").textContent = (idx + 1) + " · " + SCREENS[idx].title;
  document.getElementById("cap").textContent = SCREENS[idx].cap;
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === idx));
  // the calculator lives under the "P = Kp × error" screen only
  let showCalc = "none";
  if (SCREENS[idx].title === "P = Kp × error") { showCalc = "block"; }
  document.getElementById("calc").style.display = showCalc;
  showFormulas();
}
document.getElementById("prev").onclick = e => { e.currentTarget.blur(); show(idx - 1); };
document.getElementById("next").onclick = e => { e.currentTarget.blur(); show(idx + 1); };
window.addEventListener("keyup", e => { if (e.key === " ") { e.preventDefault(); } });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { return; }   // arrows on a slider move the slider, not the screen
  if (e.key === "ArrowRight") { show(idx + 1); }
  if (e.key === "ArrowLeft") { show(idx - 1); }
  if (e.key === " ") { e.preventDefault(); paused = !paused; if (paused) { pausedAt = performance.now(); } else { t0 += performance.now() - pausedAt; } }
});
function frame(now) {
  requestAnimationFrame(frame);
  const r = window.devicePixelRatio || 1;
  if (cv.width !== 1000 * r) { cv.width = 1000 * r; cv.height = 520 * r; }
  g.setTransform(r, 0, 0, r, 0, 0);
  const S = SCREENS[idx], speed = S.speed || 1, clock = paused ? pausedAt : now;
  const loop = S.dur / speed + 3;
  const elapsed = Math.max(0, (clock - t0) / 1000);   // a frame's timestamp can be a little EARLIER than the click that set t0
  const t = Math.min(S.dur, (elapsed % loop) * speed);
  g.clearRect(0, 0, 1000, 520);
  try {
    S.draw(t);
  } catch (err) {                                   // never let one screen freeze the whole lesson
    g.setTransform(1, 0, 0, 1, 0, 0); g.font = "600 18px IBM Plex Mono"; g.fillStyle = "#ef5f6b"; g.textAlign = "left";
    g.fillText("screen error: " + err.message, 20, 40);
    console.error(err);
  }
  if (paused) {                                       // show that space DID something
    g.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
    g.fillStyle = "rgba(239,95,107,.9)"; g.fillRect(860, 12, 124, 34);
    g.font = "600 17px IBM Plex Mono"; g.fillStyle = "#fff"; g.textAlign = "center"; g.fillText("⏸ paused", 922, 35);
  }
}
// ---------- the P calculator ----------
function calcPaint() {
  const error = parseFloat(document.getElementById("cErr").value);
  const kp = parseFloat(document.getElementById("cKp").value);
  const p = kp * error;
  let rudder = p;
  let note = "";
  if (p > LIMIT) { rudder = LIMIT; note = "  ← above +35: the rudder stops at 35"; }
  else if (p < -LIMIT) { rudder = -LIMIT; note = "  ← below −35: the rudder stops at −35"; }
  let way = "straight";
  if (rudder > 0) { way = "turn RIGHT"; }
  if (rudder < 0) { way = "turn LEFT"; }
  let clampAt = "   · X = 0: never turns";
  if (kp > 0) { clampAt = "   · clamped when |error| > 35 / " + kp.toFixed(1) + " = " + fmt(35 / kp) + "°"; }
  document.getElementById("cErrV").textContent = error + "°";
  document.getElementById("cKpV").textContent = kp.toFixed(1);
  document.getElementById("cOut").innerHTML =
    `<span style="color:var(--p)">P</span> = Kp × error = ${kp.toFixed(1)} × ${error} = <b style="color:var(--p)">${fmt(p)}</b>${note}\n` +
    `<span style="color:var(--rud)">rudder</span> = <b style="color:var(--rud)">${fmt(rudder)}°</b> → ${way}` +
    `\n📝 rudder = clamp(${kp.toFixed(1)} × error, −35, +35)` + clampAt;
  // the rudder ruler: −35 … +35, the P order (may be outside) and the real rudder
  const cv = document.getElementById("cCv"), c = cv.getContext("2d"), r = window.devicePixelRatio || 1;
  cv.width = 960 * r; cv.height = 110 * r; c.setTransform(r, 0, 0, r, 0, 0);
  const X = v => 480 + v / 110 * 440;
  c.fillStyle = "rgba(239,95,107,.15)"; c.fillRect(X(-110), 30, X(-35) - X(-110), 40); c.fillRect(X(35), 30, X(110) - X(35), 40);
  c.strokeStyle = "#8aa3b5"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(-110), 70); c.lineTo(X(110), 70); c.stroke();
  c.font = "12px IBM Plex Mono"; c.fillStyle = "#8aa3b5"; c.textAlign = "center";
  for (const v of [-100, -35, 0, 35, 100]) { c.beginPath(); c.moveTo(X(v), 66); c.lineTo(X(v), 74); c.stroke(); c.fillText(v + "°", X(v), 90); }
  c.fillStyle = "#ef5f6b"; c.fillText("too far: not possible", X(-72), 24); c.fillText("too far: not possible", X(72), 24);
  c.fillStyle = "#8f7cff"; c.beginPath(); c.arc(X(Math.max(-110, Math.min(110, p))), 50, 9, 0, 7); c.fill();
  c.fillText("P", X(Math.max(-110, Math.min(110, p))), 18 + 0);
  c.fillStyle = "#c792ea"; c.fillRect(X(rudder) - 3, 34, 6, 32);
  c.fillText("rudder", X(rudder), 106);
}
document.getElementById("cErr").addEventListener("input", calcPaint);
document.getElementById("cKp").addEventListener("input", calcPaint);
calcPaint();
show(0);
requestAnimationFrame(frame);
</script>
